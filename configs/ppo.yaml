task_name: BinFill
seed: 0
total_timesteps: 10000000  # 10 M steps for a full run; use --total_steps 100000 for a quick VM smoke-test

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# Obs (15-D) is extracted directly from the live SAPIEN physics sim:
#   eef_state (6)  = TCP [x,y,z, roll,pitch,yaw]  via agent.tcp.pose
#   joint_state(7) = arm qpos[:7]                   via agent.robot.get_qpos()
#   gripper_state(2)= finger qpos[7:9]
# flatten_keys is kept for API compatibility but is IGNORED by robomme_env.py.
env_kwargs:
  dataset: train
  action_space: joint_angle
  max_steps: 600            # BinFill has up to ~13 sequential sub-tasks, each ~30-50 steps
  episode_idx: null
  flatten_obs: true
  flatten_keys:             # ignored — obs comes from SAPIEN directly
    - eef_state_list
    - joint_state_list
    - gripper_state_list
  episode_kwargs: {}
  builder_kwargs: {}
  subtask_reward: 1.0       # +1 per sub-task completed; dense signal for BinFill
  step_penalty: 0.005       # −per non-terminal step; e.g. 7-task BinFill: 8.0 − 600×0.005 = +5.0
  fail_penalty: 1.0         # −on task failure; prevents exploiting fail-triggers to escape step penalties
  grasp_reward: 0.1         # +per new grasp event (not-holding → holding); dense signal for pick phase
  cube_in_bin_reward: 0.2   # +per cube physically placed in bin; physical-state confirmation of placement

# ---------------------------------------------------------------------------
# PPO hyperparameters
# ---------------------------------------------------------------------------
# Rollout buffer per update: n_envs × n_steps transitions.
#   n_envs=8:  8 × 1024 = 8192  → batch 1024 → 8 minibatches × 8 epochs = 64 grad steps
#              8192 steps / 600 max_steps ≈ 13 complete episodes per update  (good diversity)
#              each env sees ~1.7 complete episodes per rollout  (good advantage estimation)
# train_ppo.py auto-adjusts batch_size downward if it doesn't divide rollout evenly.
learning_rate: 1.0e-4       # reduced from 3e-4; high clip_fraction indicates updates still aggressive
n_steps: 1024               # steps per env per update; 8×1024=8192 covers ~13 BinFill episodes
batch_size: 1024            # 8192/1024 = 8 minibatches; must divide n_envs×n_steps exactly
n_epochs: 4                 # PPO reuse epochs; target_kl stops early when needed
gamma: 0.99                 # discount; effective horizon ≈ 1/(1-γ) = 100 steps, fine for max_steps=600
gae_lambda: 0.95            # GAE λ; high bias–variance trade-off standard
clip_range: 0.2             # PPO clip ε
target_kl: 0.05             # early-stop n_epochs if KL exceeds this — prevents the std 1.0→0.09
                            # collapse seen on iteration 2 (approx_kl=21.78 without this guard)
ent_coef: 0.1               # raised from 0.05: std collapsed to 0.09 in first rollout;
                            # stronger entropy bonus needed to resist all-negative-reward pressure
vf_coef: 0.5                # value loss weight; standard
max_grad_norm: 0.5          # gradient clipping; standard for PPO

# ---------------------------------------------------------------------------
# Evaluation and checkpointing
# ---------------------------------------------------------------------------
eval_interval: 200000       # every 200 k env steps ≈ 49 PPO update cycles
eval_episodes: 20           # episodes per eval; 20 gives ±SE ~0.11 for a 0.5 success rate
checkpoint_interval: 1000000

# ---------------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------------
# n_envs controls how many parallel environments are created.
#
# On a VM (direct Python run): SAPIEN spawns a full GPU physics context per
# subprocess. Spawning 16 simultaneously usually OOM-kills some. Use n_envs=1
# (DummyVecEnv, single env in the main process) — slower but reliable.
# If SubprocVecEnv fails at runtime, train_ppo.py auto-falls back to n_envs=1.
#
# On Modal (train_ppo Modal function): each Modal container has dedicated GPU,
# so larger n_envs work. Tune to VRAM:
#   8 GB  VRAM  →  n_envs: 8–16
#   16 GB VRAM  →  n_envs: 16–32
#   40 GB VRAM  →  n_envs: 32–64
# batch_size must divide n_envs × n_steps; train_ppo.py auto-adjusts if not.
n_envs:   8                 # 8 parallel SAPIEN envs; needs ~8 GB GPU VRAM; falls back to 1 if OOM
allow_gym_fallback: false
deterministic_torch: false

output_dir: logs
policy: MlpPolicy
# MUST match configs/bc.yaml so BC weights are compatible for warm-starting PPO.
# log_std_init is PPO-only (no effect on BC supervised loss).
policy_kwargs:
  net_arch: [256, 256]      # standard for manipulation; default [64,64] is too small for 15+N-D obs
  log_std_init: 0.0         # std=1.0 at init; explicit to prevent entropy collapse
device: cpu                 # MlpPolicy runs faster on CPU; GPU is reserved for SAPIEN physics
