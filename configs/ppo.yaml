task_name: PickXtimes
seed: 0
total_timesteps: 100000

# RoboMME-specific env knobs (forwarded to BenchmarkEnvBuilder /
# make_env_for_episode). See doc/env_format.md in the robomme repo.
env_kwargs:
  dataset: train          # train | val | test
  action_space: joint_angle  # joint_angle | ee_pose | waypoint
  max_steps: 300
  episode_idx: null       # null = cycle through episodes on each reset
  flatten_obs: true       # take latest frame, concat numeric state -> Box obs
  episode_kwargs: {}      # include_* flags for make_env_for_episode

learning_rate: 3.0e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5

eval_interval: 10000
eval_episodes: 5
checkpoint_interval: 25000

n_envs: 1
allow_gym_fallback: false
deterministic_torch: false

output_dir: logs
policy: MlpPolicy
device: cpu
