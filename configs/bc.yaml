task_name: BinFill
seed: 0

# ---------------------------------------------------------------------------
# Data collection
# ---------------------------------------------------------------------------
collect_demos: false        # set true to auto-collect from RoboMME recordings
n_demo_episodes: null       # null = all available train-set episodes

# ---------------------------------------------------------------------------
# BC training hyperparameters
# ---------------------------------------------------------------------------
bc_epochs: 100
bc_batch_size: 256
bc_lr: 3.0e-4
bc_l2_coef: 1.0e-4         # L2 weight decay on policy params
bc_log_every: 10            # print progress every N epochs

# Value head pretraining (runs after BC, on the same demonstration data)
# Only mlp_extractor.value_net + value_net are trained — actor weights untouched.
vf_pretrain_epochs: 20
vf_pretrain_lr: 3.0e-4     # can be lower than bc_lr if value head destabilises

# ---------------------------------------------------------------------------
# Policy architecture
# MUST match configs/ppo.yaml so state dicts are compatible for warm-starting.
# ---------------------------------------------------------------------------
policy: MlpPolicy
policy_kwargs: {}           # e.g. {net_arch: [256, 256], activation_fn: Tanh}

# PPO params needed to construct the SB3 model object
learning_rate: 3.0e-4
n_steps: 512
batch_size: 256
n_epochs: 8
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0               # no entropy bonus during BC
vf_coef: 0.5
max_grad_norm: 0.5

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env_kwargs:
  dataset: train
  action_space: joint_angle
  max_steps: 600
  episode_idx: null
  flatten_obs: true
  flatten_keys:
    - eef_state_list
    - joint_state_list
    - gripper_state_list
  episode_kwargs: {}
  subtask_reward: 0.0       # no reward shaping during demo collection or BC
  step_penalty: 0.0

# ---------------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------------
device: auto
output_dir: logs
allow_gym_fallback: false
deterministic_torch: false
